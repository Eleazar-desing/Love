<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Diagrama Causa-Efecto: Evaluación en Educación a Distancia</title>
</head>
<body>
<svg viewBox="0 0 2000 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Título -->
  <text x="1000" y="60" text-anchor="middle" font-size="36" font-weight="bold" fill="#1a5490">
    Diagrama Causa-Efecto: Evaluación en Educación a Distancia
  </text>
  
  <!-- Línea principal -->
  <line x1="200" y1="600" x2="1350" y2="600" stroke="#2c3e50" stroke-width="6"/>
  <polygon points="1350,600 1380,585 1380,615" fill="#2c3e50"/>
  
  <!-- Efecto principal -->
  <rect x="1380" y="520" width="400" height="160" fill="#e74c3c" stroke="#c0392b" stroke-width="3" rx="15"/>
  <text x="1580" y="590" text-anchor="middle" font-size="24" font-weight="bold" fill="white">
    EVALUACIÓN EFECTIVA
  </text>
  <text x="1580" y="620" text-anchor="middle" font-size="20" fill="white">
    EN EDUCACIÓN A DISTANCIA
  </text>
  
  <!-- ================= CAUSA 1 ================= -->
  <line x1="400" y1="300" x2="400" y2="600" stroke="#3498db" stroke-width="4"/>
  <rect x="250" y="120" width="300" height="80" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10"/>
  <text x="400" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
    CONCEPCIÓN DE LA EVALUACIÓN
  </text>
  
  <!-- Subcausas Causa 1 -->
  <line x1="280" y1="230" x2="360" y2="300" stroke="#5dade2" stroke-width="2"/>
  <text x="250" y="225" text-anchor="end" font-size="16" fill="#34495e">
    Evaluación como motor del aprendizaje
  </text>
  
  <line x1="520" y1="230" x2="440" y2="300" stroke="#5dade2" stroke-width="2"/>
  <text x="550" y="225" text-anchor="start" font-size="16" fill="#34495e">
    Propósitos formativos y sumativos integrados
  </text>
  
  <line x1="280" y1="270" x2="360" y2="300" stroke="#5dade2" stroke-width="2"/>
  <text x="250" y="265" text-anchor="end" font-size="16" fill="#34495e">
    Proceso continuo
  </text>
  
  <line x1="520" y1="270" x2="440" y2="300" stroke="#5dade2" stroke-width="2"/>
  <text x="550" y="265" text-anchor="start" font-size="16" fill="#34495e">
    Múltiples necesidades
  </text>
  
  <!-- ================= CAUSA 2 ================= -->
  <line x1="800" y1="300" x2="800" y2="600" stroke="#27ae60" stroke-width="4"/>
  <rect x="650" y="120" width="300" height="80" fill="#27ae60" stroke="#229954" stroke-width="2" rx="10"/>
  <text x="800" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
    PRODUCTOS DE EVALUACIÓN
  </text>
  
  <!-- Subcausas Causa 2 -->
  <line x1="680" y1="230" x2="760" y2="300" stroke="#58d68d" stroke-width="2"/>
  <text x="650" y="225" text-anchor="end" font-size="16" fill="#34495e">
    Pensamiento crítico: ensayos, reportes
  </text>
  
  <line x1="920" y1="230" x2="840" y2="300" stroke="#58d68d" stroke-width="2"/>
  <text x="950" y="225" text-anchor="start" font-size="16" fill="#34495e">
    Resolución de problemas: proyectos, casos
  </text>
  
  <line x1="680" y1="270" x2="760" y2="300" stroke="#58d68d" stroke-width="2"/>
  <text x="650" y="265" text-anchor="end" font-size="16" fill="#34495e">
    Gestión personal
  </text>
  
  <line x1="920" y1="270" x2="840" y2="300" stroke="#58d68d" stroke-width="2"/>
  <text x="950" y="265" text-anchor="start" font-size="16" fill="#34495e">
    Productos digitales
  </text>
  
  <!-- ================= CAUSA 3 ================= -->
  <line x1="1200" y1="300" x2="1200" y2="600" stroke="#9b59b6" stroke-width="4"/>
  <rect x="1050" y="120" width="300" height="80" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="10"/>
  <text x="1200" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
    RETROALIMENTACIÓN
  </text>
  
  <!-- Subcausas Causa 3 -->
  <line x1="1080" y1="230" x2="1160" y2="300" stroke="#bb8fce" stroke-width="2"/>
  <text x="1050" y="225" text-anchor="end" font-size="16" fill="#34495e">
    Función motivacional e informativa
  </text>
  
  <line x1="1320" y1="230" x2="1240" y2="300" stroke="#bb8fce" stroke-width="2"/>
  <text x="1350" y="225" text-anchor="start" font-size="16" fill="#34495e">
    Oportuna y frecuente
  </text>
  
  <line x1="1080" y1="270" x2="1160" y2="300" stroke="#bb8fce" stroke-width="2"/>
  <text x="1050" y="265" text-anchor="end" font-size="16" fill="#34495e">
    Orientadora
  </text>
  
  <line x1="1320" y1="270" x2="1240" y2="300" stroke="#bb8fce" stroke-width="2"/>
  <text x="1350" y="265" text-anchor="start" font-size="16" fill="#34495e">
    Tecnológicamente mediada
  </text>
  
  <!-- ================= CAUSAS INFERIORES ================= -->
  <!-- CAUSA 4 -->
  <line x1="550" y1="900" x2="550" y2="600" stroke="#e67e22" stroke-width="4"/>
  <rect x="400" y="940" width="300" height="80" fill="#e67e22" stroke="#d35400" stroke-width="2" rx="10"/>
  <text x="550" y="980" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
    FUNDAMENTOS PEDAGÓGICOS
  </text>
  
  <!-- Subcausas Causa 4 -->
  <line x1="450" y1="850" x2="520" y2="900" stroke="#f0b27a" stroke-width="2"/>
  <text x="420" y="845" text-anchor="end" font-size="16" fill="#34495e">
    Constructivismo
  </text>
  
  <line x1="650" y1="850" x2="580" y2="900" stroke="#f0b27a" stroke-width="2"/>
  <text x="680" y="845" text-anchor="start" font-size="16" fill="#34495e">
    Aprendizaje colaborativo
  </text>
  
  <line x1="450" y1="810" x2="520" y2="900" stroke="#f0b27a" stroke-width="2"/>
  <text x="420" y="805" text-anchor="end" font-size="16" fill="#34495e">
    Basado en problemas
  </text>
  
  <line x1="650" y1="810" x2="580" y2="900" stroke="#f0b27a" stroke-width="2"/>
  <text x="680" y="805" text-anchor="start" font-size="16" fill="#34495e">
    Aprendizaje situado
  </text>
  
  <!-- CAUSA 5 -->
  <line x1="950" y1="900" x2="950" y2="600" stroke="#16a085" stroke-width="4"/>
  <rect x="800" y="940" width="300" height="80" fill="#16a085" stroke="#138d75" stroke-width="2" rx="10"/>
  <text x="950" y="980" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
    TECNOLOGÍA
  </text>
  
  <!-- Subcausas Causa 5 -->
  <line x1="850" y1="850" x2="920" y2="900" stroke="#48c9b0" stroke-width="2"/>
  <text x="820" y="845" text-anchor="end" font-size="16" fill="#34495e">
    Automatización
  </text>
  
  <line x1="1050" y1="850" x2="980" y2="900" stroke="#48c9b0" stroke-width="2"/>
  <text x="1080" y="845" text-anchor="start" font-size="16" fill="#34495e">
    Accesibilidad 24/7
  </text>
  
  <line x1="850" y1="810" x2="920" y2="900" stroke="#48c9b0" stroke-width="2"/>
  <text x="820" y="805" text-anchor="end" font-size="16" fill="#34495e">
    Herramientas diversas
  </text>
  
  <line x1="1050" y1="810" x2="980" y2="900" stroke="#48c9b0" stroke-width="2"/>
  <text x="1080" y="805" text-anchor="start" font-size="16" fill="#34495e">
    Inmediatez
  </text>
  
  <!-- Efectos secundarios -->
  <rect x="1480" y="300" width="320" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="8"/>
  <text x="1640" y="335" text-anchor="middle" font-size="16" fill="#2c3e50">
    Aprendizaje significativo
  </text>
  
  <rect x="1480" y="390" width="320" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="8"/>
  <text x="1640" y="425" text-anchor="middle" font-size="16" fill="#2c3e50">
    Desarrollo de competencias
  </text>
  
  <rect x="1480" y="690" width="320" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="8"/>
  <text x="1640" y="725" text-anchor="middle" font-size="16" fill="#2c3e50">
    Autonomía del estudiante
  </text>
  
  <rect x="1480" y="780" width="320" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="8"/>
  <text x="1640" y="815" text-anchor="middle" font-size="16" fill="#2c3e50">
    Mejora continua
  </text>
  
  <!-- Conexión efectos -->
  <line x1="1380" y1="580" x2="1480" y2="330" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1380" y1="590" x2="1480" y2="420" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1380" y1="610" x2="1480" y2="720" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1380" y1="620" x2="1480" y2="810" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
</svg>
</body>
</html>
